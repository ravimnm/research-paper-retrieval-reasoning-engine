spring:
  application:
    name: research-retrieval-api

  datasource:
    url: jdbc:postgresql://localhost:5432/research_retrieval
    username: postgres
    password: post

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

ai-engine:
  base-url: https://underuse-makeover-reminder.ngrok-free.dev

file:
  upload-dir: uploads/papers
  
management:
  endpoints:
    web:
      exposure:
        include: health,info
